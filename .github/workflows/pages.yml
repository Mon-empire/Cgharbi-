# Publie le site (digitale-academie/v5) sur la branche gh-pages, servie par GitHub Pages :
# https://mon-empire.github.io/Cgharbi-/ — à chaque mise à jour du site sur la branche de travail ou sur main.
name: Site (GitHub Pages)
on:
  push:
    branches: [claude/digitale-academie-refonte-cphasb, main]
    paths: ['digitale-academie/v5/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copier le site sur gh-pages
        run: |
          set -e
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          rm -rf /tmp/site && cp -r digitale-academie/v5 /tmp/site && touch /tmp/site/.nojekyll
          git fetch origin gh-pages && git checkout -B gh-pages origin/gh-pages
          git rm -rq . && cp -r /tmp/site/. . && git add -A
          git commit -m "Site publié depuis ${GITHUB_SHA::7}" || { echo "rien de neuf"; exit 0; }
          git push origin gh-pages
