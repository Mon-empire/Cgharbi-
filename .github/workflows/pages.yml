# Publie le site (digitale-academie/v5) sur GitHub Pages à chaque mise à jour de la branche de travail.
name: Site (GitHub Pages)
on:
  push:
    branches: [claude/digitale-academie-refonte-cphasb, main]
    paths: ['digitale-academie/v5/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: digitale-academie/v5 }
      - id: d
        uses: actions/deploy-pages@v4
